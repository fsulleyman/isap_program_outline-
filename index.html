<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ISAP Forum 2026 Programme Outline</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700&family=Source+Sans+3:wght@400;600&display=swap">
<style>
:root{--bg:#EFF1F7;--surface:#fff;--ink:#141a3c;--muted:#58607e;--line:#d9dde9;--accent:#1b2557;--accent-ink:#fff;--gold:#B8862A;--hero:#101536;--hero-ink:#fff;--chip:#F6EBD3;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b0f26;--surface:#151b3d;--ink:#eceefa;--muted:#a0a8c9;--line:#262e5a;--accent:#d4a63f;--accent-ink:#0b0f26;--gold:#d4a63f;--hero:#101536;--chip:#2a2a3d}}
:root[data-theme="dark"]{--bg:#0b0f26;--surface:#151b3d;--ink:#eceefa;--muted:#a0a8c9;--line:#262e5a;--accent:#d4a63f;--accent-ink:#0b0f26;--gold:#d4a63f;--hero:#101536;--chip:#2a2a3d}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 17px/1.55 "Source Sans 3",system-ui,sans-serif}
h1,h2,h3{font-family:"Bricolage Grotesque",system-ui,sans-serif;line-height:1.15;margin:0}
.wrap{max-width:720px;margin:0 auto}
.hero{background:var(--hero);color:var(--hero-ink);padding:40px 20px 34px}
.org{margin:18px 0 6px;font-size:.95rem;color:#c9cde6}
.logo-upsa,.logo-isap{display:block;max-width:100%;height:auto;mix-blend-mode:lighten}
.logo-upsa{width:210px}
.logo-isap{width:min(320px,80%);margin-left:-6px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.hero h1{font-size:clamp(2.6rem,12vw,4.6rem);font-weight:700;letter-spacing:-.03em}
.hero h1 span{color:#d4a63f}
.sub{margin:6px 0 0;color:#c9cde6}
.theme{margin:22px 0 0;font:500 clamp(1.1rem,4.4vw,1.4rem)/1.35 "Bricolage Grotesque",sans-serif;max-width:34ch}
.facts{display:grid;gap:10px;margin:24px 0 0;padding:0;list-style:none}
.facts li{border-left:3px solid #d4a63f;padding-left:12px}
.facts b{display:block;font-weight:600}
.facts small{color:#c9cde6;font-size:.9rem}
a:focus-visible,button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.outline-head{padding:30px 20px 18px}
.outline-head h2{font-size:clamp(1.8rem,7vw,2.4rem);letter-spacing:-.02em}
.outline-head h2::after{content:"";display:block;width:56px;height:4px;background:var(--gold);border-radius:2px;margin-top:10px}
.outline-head p{margin:12px 0 0;color:var(--muted)}
.tabs{position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);border-bottom:1px solid var(--line);z-index:2}
.tabs .wrap{display:flex;gap:8px;padding:10px 20px}
.tab{flex:1;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:600 16px "Source Sans 3",sans-serif;padding:10px 12px;border-radius:999px;cursor:pointer}
.tab[aria-selected="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
main{padding:22px 20px 40px}
.head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:14px}
.head h2{font-size:1.4rem}
.head button{background:none;border:0;color:var(--accent);font:600 15px "Source Sans 3",sans-serif;cursor:pointer;padding:6px 0;text-decoration:underline}
:root[data-theme="dark"] .head button{color:var(--gold)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .head button{color:var(--gold)}}
.item{background:var(--surface);border:1px solid var(--line);border-radius:10px;margin-bottom:10px}
.item.key{border-left:5px solid var(--gold)}
.item.rest{background:transparent;border-style:dashed}
.item button{all:unset;box-sizing:border-box;display:grid;grid-template-columns:92px 1fr 18px;gap:12px;align-items:start;width:100%;padding:14px 16px;cursor:pointer}
.item button:focus-visible{outline:3px solid var(--gold);outline-offset:-3px;border-radius:10px}
.time{font-weight:600;font-size:.93rem;color:var(--accent)}
:root[data-theme="dark"] .time{color:var(--gold)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .time{color:var(--gold)}}
.dur{display:block;font-weight:400;color:var(--muted);font-size:.85rem}
.title{font-family:"Bricolage Grotesque",sans-serif;font-weight:500;font-size:1.08rem;line-height:1.3}
.chev{color:var(--muted);transition:transform .2s;padding-top:3px}
.item[data-open="true"] .chev{transform:rotate(180deg)}
.detail{display:none;padding:0 16px 16px 120px;color:var(--muted)}
.item[data-open="true"] .detail{display:block}
.detail h3{font:600 .9rem "Source Sans 3",sans-serif;color:var(--ink);margin:0 0 2px}
.detail p{margin:0 0 10px}
.detail ul{margin:0 0 10px;padding-left:18px}
.chip{display:inline-block;background:var(--chip);color:var(--ink);border-radius:6px;padding:1px 8px;font-size:.85rem}
.stage{background:var(--hero);padding:calc(14px + env(safe-area-inset-top,0px)) 0 18px}
.car-wrap{position:relative;max-width:980px;margin:0 auto}
.car{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch;scrollbar-width:none;outline-offset:-3px}
.car::-webkit-scrollbar{display:none}
.slide{flex:0 0 100%;scroll-snap-align:center;scroll-snap-stop:always;background:#fff;display:flex;align-items:center;justify-content:center;min-height:0}
.slide .sheet{margin:0;border:0;border-radius:0;box-shadow:none;width:100%;cursor:zoom-in}
.slide3{flex-direction:column;align-items:stretch;justify-content:center;gap:10px;padding:14px 12px;aspect-ratio:1500/1160;color:#101536}
.slide3 h2{font-size:clamp(1rem,3.6vw,1.6rem);text-align:center;color:#101536}
.logos3{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:center}
.logos3 img{display:block;height:clamp(34px,8.4vw,64px);width:auto}
.nav{position:absolute;top:50%;transform:translateY(-50%);width:44px;height:64px;border:0;border-radius:10px;background:rgba(16,21,54,.72);color:#fff;font:400 34px/1 sans-serif;cursor:pointer;z-index:1}
.nav.prev{left:6px}.nav.next{right:6px}
.nav:disabled{opacity:.25;cursor:default}
.pills{display:flex;gap:8px;justify-content:center;padding:14px 12px 0;flex-wrap:wrap}
.pills button{border:1px solid #3a4478;background:transparent;color:#e8ebf8;font:600 15px "Source Sans 3",sans-serif;padding:8px 13px;border-radius:999px;cursor:pointer}
.pills button[aria-selected="true"]{background:#d4a63f;color:#101536;border-color:#d4a63f}
.swipe{margin:10px 0 0;text-align:center;color:#a9b0d6;font-size:.88rem}
.nav:focus-visible,.pills button:focus-visible{outline:3px solid #d4a63f;outline-offset:2px}
@media (hover:none){.nav{display:none}}
@media (prefers-reduced-motion:no-preference){.car{scroll-behavior:smooth}}
.bar{display:flex;align-items:center;justify-content:space-between;gap:10px;max-width:980px;margin:14px auto 0;padding:0 12px}
.step{flex:0 0 auto;min-width:112px;min-height:48px;border:1px solid #3a4478;background:transparent;color:#fff;font:600 17px "Source Sans 3",sans-serif;padding:10px 16px;border-radius:10px;cursor:pointer}
.step.go{background:#d4a63f;color:#101536;border-color:#d4a63f}
.step:disabled{opacity:.35;cursor:default}
.step:focus-visible{outline:3px solid #d4a63f;outline-offset:2px}
.count{flex:1;text-align:center;color:#c9cde6;font-size:.9rem;line-height:1.3}
.count b{display:block;color:#fff;font-size:1.1rem}
@media (max-width:420px){.step{min-width:92px;padding:10px 10px;font-size:16px}}
.sheets{padding:8px 20px 28px}
.sheets h2{font-size:1.4rem}
.sheets p{margin:6px 0 16px;color:var(--muted)}
.sheet{all:unset;display:block;width:100%;margin:0 0 16px;border:1px solid var(--line);border-radius:12px;overflow:hidden;cursor:zoom-in;background:#fff;box-shadow:0 2px 14px rgba(10,15,40,.12)}
.sheet:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
.sheet img{display:block;width:100%;height:auto}
.lb{position:fixed;inset:0;background:rgba(5,8,24,.94);z-index:10;display:flex;flex-direction:column}
.lb[hidden]{display:none}
.lb-x{align-self:flex-end;margin:calc(10px + env(safe-area-inset-top,0px)) 14px 8px;background:#d4a63f;color:#101536;border:0;border-radius:8px;padding:10px 16px;font:600 16px "Source Sans 3",sans-serif;cursor:pointer}
.lb-body{flex:1;overflow:auto;padding:0 0 calc(16px + env(safe-area-inset-bottom,0px));-webkit-overflow-scrolling:touch}
.lb-body img{display:block;width:max(100%,1100px);max-width:none;height:auto;margin:0 auto;background:#fff}
.partners{padding:8px 20px 40px}
.partners h2{font-size:1.4rem}
.partners p{margin:6px 0 16px;color:var(--muted)}
.logos{list-style:none;margin:0;padding:22px 16px;background:#fff;border:1px solid var(--line);border-radius:12px;display:flex;flex-wrap:wrap;gap:22px 28px;align-items:center;justify-content:center}
.logos img{display:block;width:auto;max-width:100%;object-fit:contain}
footer{text-align:center;color:var(--muted);font-size:.9rem;padding:0 20px 36px}
footer a{color:inherit}
@media (max-width:480px){.item button{grid-template-columns:78px 1fr 16px;gap:10px}.detail{padding-left:16px}}
@media (prefers-reduced-motion:reduce){.chev{transition:none}}
body{background:#101536}
footer{color:#a9b0d6;padding-top:22px}footer a{color:#a9b0d6}
</style>
</head>

<script>
const $ = id => document.getElementById(id);

const car=$('car'),LBL=["Programme outline · Part 1","Programme outline · Part 2","Participating institutions"];
let idx=0;
const go=i=>{idx=Math.max(0,Math.min(2,i));car.scrollTo({left:idx*car.clientWidth})};
function sync(){idx=Math.round(car.scrollLeft/car.clientWidth);$('cnt').textContent=(idx+1)+' / 3';$('lbl').textContent=LBL[idx];$('prev').disabled=idx===0;$('next').disabled=idx===2}
car.addEventListener('scroll',()=>requestAnimationFrame(sync),{passive:true});
$('prev').onclick=()=>go(idx-1);$('next').onclick=()=>go(idx+1);
car.addEventListener('keydown',e=>{if(e.key==='ArrowRight'){e.preventDefault();go(idx+1)}if(e.key==='ArrowLeft'){e.preventDefault();go(idx-1)}});
window.addEventListener('resize',()=>car.scrollTo({left:idx*car.clientWidth,behavior:'instant'}));
sync();
const lb=$('lb'),lbimg=$('lbimg');
document.querySelectorAll('.sheet').forEach(b=>b.onclick=()=>{lbimg.src=b.querySelector('img').src;lbimg.alt=b.querySelector('img').alt;lb.hidden=false;lb.querySelector('.lb-body').scrollTop=0;$('lbx').focus()});
const closeLb=()=>{lb.hidden=true};
$('lbx').onclick=closeLb;
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!lb.hidden)closeLb()});
</script>
